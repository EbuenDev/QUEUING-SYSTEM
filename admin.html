<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RHU II Admin Panel</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-left">
        <img class="header-logo" src="src/images/logo.png" alt="RHU II Logo" />
        <div>
          <p class="eyebrow">Municipal Health Office</p>
          <h1>Rural Health Unit II</h1>
          <p>mag away kayoooo
            .</p>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="logout-btn" class="nav-link logout-btn" type="button" hidden>Log out</button>
        <a class="nav-link" href="index.html">Patient Display</a>
        <a class="nav-link" href="bhw.html">BHW Panel</a>
      </div>
    </header>

    <main class="board admin-board">
      <section id="login-card" class="card auth-card">
        <h2>Admin Login</h2>
        <p class="muted">Sign in to manage the queue.</p>
        <form id="admin-login-form" class="auth-form">
          <input id="admin-username" name="username" type="text" placeholder="Username" autocomplete="username" required />
          <input id="admin-password" name="password" type="password" placeholder="Password" autocomplete="current-password" required />
          <button type="submit" class="btn btn-primary">Log In</button>
        </form>
        <p id="login-error" class="auth-error" role="alert"></p>
      </section>

      <section id="admin-panel" class="card full-width" hidden>
        <form id="patient-form" class="patient-form">
          <input id="patient-name" name="name" type="text" placeholder="Full Name" required />
          <input id="patient-philhealth-id" name="philHealthId" type="text" placeholder="PhilHealth ID" />
          <select id="patient-status" name="patientStatus" aria-label="Patient Status">
            <option value="regular">REGULAR</option>
            <option value="senior">SENIOR</option>
            <option value="pwd">PWD</option>
            <option value="emergency">EMERGENCY</option>
          </select>
          <select id="philhealth-status" name="philHealthStatus" aria-label="PhilHealth Status">
            <option value="no-philhealth">NO PHILHEALTH</option>
            <option value="registered">REGISTERED</option>
            <option value="not-registered">NOT REGISTERED</option>
            <option value="other-facility">OTHER FACILITY</option>
          </select>
          <button type="submit" class="btn btn-primary">Add Patient</button>
        </form>

        <div id="edit-patient-modal" class="card edit-modal" hidden>
          <h3>Edit Patient</h3>
          <form id="edit-patient-form" class="patient-form">
            <input id="edit-patient-id" type="hidden" />
            <input id="edit-patient-name" name="name" type="text" placeholder="Full Name" required />
            <input id="edit-patient-philhealth-id" name="philHealthId" type="text" placeholder="PhilHealth ID" />
            <select id="edit-patient-status" name="patientStatus" aria-label="Patient Status">
              <option value="regular">REGULAR</option>
              <option value="senior">SENIOR</option>
              <option value="pwd">PWD</option>
              <option value="emergency">EMERGENCY</option>
            </select>
            <select id="edit-philhealth-status" name="philHealthStatus" aria-label="PhilHealth Status">
              <option value="no-philhealth">NO PHILHEALTH</option>
              <option value="registered">REGISTERED</option>
              <option value="not-registered">NOT REGISTERED</option>
              <option value="other-facility">OTHER FACILITY</option>
            </select>
            <div class="toolbar">
              <button type="submit" class="btn btn-primary">Save Changes</button>
              <button type="button" id="cancel-edit-btn" class="btn btn-secondary">Cancel</button>
            </div>
          </form>
        </div>

        <div class="toolbar">
          <button id="serve-next-btn" class="btn btn-primary">Serve Next</button>
          <button id="reset-btn" class="btn btn-secondary">Reset Queue</button>
          <button id="print-consultation-btn" class="btn btn-secondary" type="button">Print Consultation</button>
        </div>

        <div class="section-header">
          <h2>Patient List</h2>
          <span id="admin-count" class="pill">0 patients</span>
        </div>
        <ul id="patient-list" class="queue-list admin-list"></ul>

        <div id="edit-history-modal" class="card edit-modal" hidden>
          <h3>Edit Recent Checkup</h3>
          <form id="edit-history-form" class="patient-form">
            <input id="edit-history-id" type="hidden" />
            <input id="edit-history-icd-code" name="icdCode" type="text" placeholder="ICD Code" required />
            <textarea id="edit-history-consultation" name="consultationDetails" rows="4" placeholder="Consultation details"></textarea>
            <div class="toolbar">
              <button type="submit" class="btn btn-primary">Save Changes</button>
              <button type="button" id="cancel-history-edit-btn" class="btn btn-secondary">Cancel</button>
            </div>
          </form>
        </div>

        <div class="section-header">
          <h2>Consultation History</h2>
          <span id="history-count" class="pill">0 entries</span>
        </div>
        <ul id="consultation-history" class="queue-list"></ul>
      </section>
    </main>

    <footer class="site-credit">Developed by Mark Ian C. Ebuen</footer>

    <script src="src/queue-ui.js"></script>
    <script src="app.js"></script>
  </body>
</html>
