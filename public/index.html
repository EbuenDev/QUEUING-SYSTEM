<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>RHU II Patient Queue - Waiting Room</title>
    <link rel="stylesheet" href="assets/styles.css?v=5.2" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="icon" type="image/png" href="assets/favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="assets/favicon-16x16.png" sizes="16x16" />
    <script src="https://www.youtube.com/iframe_api"></script>
  </head>
  <body class="waiting-room">
    <header class="waiting-room-header">
      <div class="header-left">
        <img class="header-logo" src="assets/logo.png" alt="RHU II Logo" />
        <div class="header-info">
          <p class="eyebrow">MUNICIPAL HEALTH OFFICE</p>
          <h1 class="header-title">Rural Health Unit II</h1>
        </div>
      </div>
      <div class="header-right">
        <div class="clock-container">
          <div id="live-clock" class="header-clock">--:--:--</div>
          <div id="live-date" class="header-date">Loading...</div>
        </div>
      </div>
    </header>

    <main class="waiting-room-main">
      <!-- Left Column: Patient Queue Information -->
      <section class="queue-column">
        <div class="queue-card now-serving-card">
          <div class="card-label">NOW SERVING</div>
          <div id="current-serving" class="queue-number">---</div>
          <div id="current-serving-message" class="queue-message">Please wait for the first patient</div>
        </div>

        <div class="queue-card next-patient-card">
          <div class="card-label">NEXT PATIENT</div>
          <div id="next-patient" class="queue-number">---</div>
        </div>

        <div class="queue-card waiting-list-card">
          <div class="card-header">
            <h2 class="card-title">Waiting List</h2>
            <span id="queue-count" class="count-badge">0 patients</span>
          </div>
          <ul id="waiting-list" class="waiting-list"></ul>
        </div>

        <div id="followup-section" class="queue-card followup-card" hidden>
          <div class="card-header">
            <h2 class="card-title">RETURN / FOLLOW-UP</h2>
          </div>
          <ul id="followup-list" class="waiting-list"></ul>
        </div>
      </section>

      <!-- Right Column: Health Education Video Player (Maximized) -->
      <section class="video-column">
        <div class="video-card">
          <div class="card-header">
            <h2 class="card-title">Health Education</h2>
            <span class="card-subtitle">YouTube playlist</span>
          </div>
          <div id="youtube-player-container" class="youtube-player-container">
            <div id="youtube-placeholder" class="youtube-placeholder">
              <div class="placeholder-icon">📺</div>
              <div class="placeholder-text">No playlist configured</div>
            </div>
            <div id="youtube-player" class="youtube-player"></div>
            <button id="video-unmute-notice" class="video-unmute-badge" type="button" hidden>
              <i class="fa-solid fa-volume-xmark"></i>
              <span>Click anywhere to unmute</span>
            </button>
          </div>
        </div>
      </section>
    </main>

    <script src="assets/app.js?v=5.4"></script>
  </body>
</html>
