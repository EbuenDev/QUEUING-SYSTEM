<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RHU II Super Admin Panel</title>
    <link rel="stylesheet" href="assets/styles.css">
    <link rel="icon" type="image/png" href="assets/favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="assets/favicon-16x16.png" sizes="16x16" />

    <style>
        .user-management {
            margin-top: 20px;
        }
        .user-list {
            margin-top: 20px;
        }
        .user-item {
            background: #f5f5f5;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-info {
            flex: 1;
        }
        .user-actions {
            display: flex;
            gap: 10px;
        }
        .role-badge {
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: bold;
        }
        .role-admin { background: #007bff; color: white; }
        .role-doctor { background: #28a745; color: white; }
        .role-super_admin { background: #dc3545; color: white; }
        .status-active { color: green; }
        .status-inactive { color: red; }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 5px;
            width: 400px;
            max-width: 90%;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 3px;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-left">
            <img class="header-logo" src="assets/logo.png" alt="RHU II Logo">
            <div>
                <p class="eyebrow">Municipal Health Office</p>
                <h1>Rural Health Unit II</h1>
                <p>Super Admin Panel</p>
            </div>
        </div>
        <div class="topbar-actions">
            <button id="logout-btn" class="nav-link logout-btn" type="button" hidden>Log out</button>
            <a class="nav-link" href="index.html">Patient Display</a>
            <a class="nav-link" href="admin.html">Admin Panel</a>
        </div>
    </header>

    <main class="board admin-board">
        <section id="login-card" class="card auth-card">
            <h2>Super Admin Login</h2>
            <p class="muted">Sign in to manage users.</p>
            <form id="superadmin-login-form" class="auth-form" method="post" action="">
                <input id="superadmin-username" name="username" type="text" placeholder="Username" autocomplete="username" required />
                <input id="superadmin-password" name="password" type="password" placeholder="Password" autocomplete="current-password" required />
                <button type="submit" class="btn btn-primary">Log In</button>
            </form>
            <p id="login-error" class="auth-error" role="alert"></p>
        </section>

        <section id="superadmin-panel" class="card full-width" hidden>
            <h2>User Management</h2>
            <button id="add-user-btn" class="btn btn-primary">Add New User</button>
            
            <div id="user-list" class="user-list">
                <p>Loading users...</p>
            </div>
        </section>
    </main>

    <!-- Add/Edit User Modal -->
    <div id="user-modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title">Add New User</h3>
            <form id="user-form">
                <input type="hidden" id="user-id">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="full-name">Full Name:</label>
                    <input type="text" id="full-name" name="full_name" required>
                </div>
                <div class="form-group">
                    <label for="role">Role:</label>
                    <select id="role" name="role" required>
                        <option value="admin">Admin</option>
                        <option value="doctor">Doctor</option>
                    </select>
                </div>
                <div class="form-group" id="password-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password">
                </div>
                <div class="form-group" id="new-password-group" hidden>
                    <label for="new-password">New Password (leave blank to keep current):</label>
                    <input type="password" id="new-password" name="new_password">
                </div>
                <div class="form-group" id="active-group" hidden>
                    <label>
                        <input type="checkbox" id="is-active" name="is_active">
                        Active
                    </label>
                </div>
                <div class="modal-actions">
                    <button type="button" id="cancel-btn" class="btn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin + '/backend/api_postgres.php';
        let currentUser = null;

        // Check if already logged in
        async function checkAuth() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                // For now, we'll rely on session-based auth
                // In a real app, you'd have an endpoint to check current user
            } catch (error) {
                console.error('Auth check failed:', error);
            }
        }

        // Super admin login
        document.getElementById('superadmin-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('superadmin-username').value;
            const password = document.getElementById('superadmin-password').value;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'login',
                        username: username,
                        password: password
                    })
                });
                const data = await response.json();

                if (data.success) {
                    currentUser = data.user;
                    if (currentUser && currentUser.role === 'super_admin') {
                        document.getElementById('login-card').hidden = true;
                        document.getElementById('superadmin-panel').hidden = false;
                        document.getElementById('logout-btn').hidden = false;
                        loadUsers();
                    } else {
                        document.getElementById('login-error').textContent = 'Access denied. Super admin role required.';
                    }
                } else {
                    document.getElementById('login-error').textContent = data.message || 'Login failed';
                }
            } catch (error) {
                document.getElementById('login-error').textContent = 'Login failed. Please try again.';
            }
        });

        // Logout
        document.getElementById('logout-btn').addEventListener('click', async () => {
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'logout' })
                });
            } catch (error) {
                console.error('Logout failed:', error);
            }
            location.reload();
        });

        // Load users
        async function loadUsers() {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'list-users' })
                });
                const data = await response.json();

                if (data.success) {
                    displayUsers(data.users);
                } else {
                    document.getElementById('user-list').innerHTML = '<p>Failed to load users</p>';
                }
            } catch (error) {
                document.getElementById('user-list').innerHTML = '<p>Error loading users</p>';
            }
        }

        // Display users
        function displayUsers(users) {
            const userList = document.getElementById('user-list');
            if (users.length === 0) {
                userList.innerHTML = '<p>No users found</p>';
                return;
            }

            userList.innerHTML = users.map(user => `
                <div class="user-item">
                    <div class="user-info">
                        <strong>${user.full_name}</strong> (${user.username})
                        <br>
                        <span class="role-badge role-${user.role}">${user.role.replace('_', ' ').toUpperCase()}</span>
                        <span class="${user.is_active ? 'status-active' : 'status-inactive'}">
                            ${user.is_active ? 'Active' : 'Inactive'}
                        </span>
                    </div>
                    <div class="user-actions">
                        ${user.role !== 'super_admin' ? `
                            <button class="btn btn-sm" onclick="editUser(${user.id})">Edit</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteUser(${user.id})">Delete</button>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        // Add user modal
        document.getElementById('add-user-btn').addEventListener('click', () => {
            document.getElementById('modal-title').textContent = 'Add New User';
            document.getElementById('user-form').reset();
            document.getElementById('user-id').value = '';
            document.getElementById('password-group').hidden = false;
            document.getElementById('password').required = true;
            document.getElementById('new-password-group').hidden = true;
            document.getElementById('active-group').hidden = true;
            document.getElementById('user-modal').classList.add('active');
        });

        // Edit user
        window.editUser = async (userId) => {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'list-users' })
                });
                const data = await response.json();
                const user = data.users.find(u => u.id === userId);

                if (user) {
                    document.getElementById('modal-title').textContent = 'Edit User';
                    document.getElementById('user-id').value = user.id;
                    document.getElementById('username').value = user.username;
                    document.getElementById('full-name').value = user.full_name;
                    document.getElementById('role').value = user.role;
                    document.getElementById('password-group').hidden = true;
                    document.getElementById('password').required = false;
                    document.getElementById('new-password-group').hidden = false;
                    document.getElementById('active-group').hidden = false;
                    document.getElementById('is-active').checked = user.is_active;
                    document.getElementById('user-modal').classList.add('active');
                }
            } catch (error) {
                alert('Failed to load user data');
            }
        };

        // Delete user
        window.deleteUser = async (userId) => {
            if (!confirm('Are you sure you want to delete this user?')) return;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'delete-user',
                        id: userId
                    })
                });
                const data = await response.json();

                if (data.success) {
                    loadUsers();
                } else {
                    alert(data.message || 'Failed to delete user');
                }
            } catch (error) {
                alert('Failed to delete user');
            }
        };

        // Save user
        document.getElementById('user-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const userId = document.getElementById('user-id').value;
            const isEdit = userId !== '';

            const payload = {
                action: isEdit ? 'update-user' : 'create-user',
                username: document.getElementById('username').value,
                full_name: document.getElementById('full-name').value,
                role: document.getElementById('role').value
            };

            if (isEdit) {
                payload.id = parseInt(userId);
                payload.new_password = document.getElementById('new-password').value;
                payload.is_active = document.getElementById('is-active').checked;
            } else {
                payload.password = document.getElementById('password').value;
            }

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();

                if (data.success) {
                    document.getElementById('user-modal').classList.remove('active');
                    loadUsers();
                } else {
                    alert(data.message || 'Failed to save user');
                }
            } catch (error) {
                alert('Failed to save user');
            }
        });

        // Cancel modal
        document.getElementById('cancel-btn').addEventListener('click', () => {
            document.getElementById('user-modal').classList.remove('active');
        });

        // Close modal on outside click
        document.getElementById('user-modal').addEventListener('click', (e) => {
            if (e.target.id === 'user-modal') {
                document.getElementById('user-modal').classList.remove('active');
            }
        });

        // Initial auth check
        checkAuth();
    </script>
</body>
</html>
