<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Indicator Debug Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 3px;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
        input {
            padding: 10px;
            width: 300px;
            margin: 5px;
        }
        #log {
            background: #f5f5f5;
            padding: 10px;
            height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>Typing Indicator Debug Test</h1>

    <div class="test-section">
        <h2>Step 1: Login</h2>
        <input type="text" id="username" placeholder="Username (admin or renz)" value="admin">
        <input type="password" id="password" placeholder="Password" value="admin123">
        <button onclick="login()">Login</button>
        <div id="login-status" class="status"></div>
    </div>

    <div class="test-section">
        <h2>Step 2: Set Typing Status</h2>
        <button onclick="setTyping(true)">Set Typing = TRUE</button>
        <button onclick="setTyping(false)">Set Typing = FALSE</button>
        <div id="set-status" class="status"></div>
    </div>

    <div class="test-section">
        <h2>Step 3: Check Partner Typing Status</h2>
        <button onclick="checkTyping()">Check if Partner is Typing</button>
        <div id="check-status" class="status"></div>
    </div>

    <div class="test-section">
        <h2>Step 4: Simulate Typing Input</h2>
        <input type="text" id="typing-input" placeholder="Type here to simulate typing">
        <div id="input-status" class="status"></div>
    </div>

    <div class="test-section">
        <h2>Step 5: Auto-Poll Typing Status</h2>
        <button onclick="startPolling()">Start Polling (every 1s)</button>
        <button onclick="stopPolling()">Stop Polling</button>
        <div id="poll-status" class="status"></div>
    </div>

    <div class="test-section">
        <h2>Activity Log</h2>
        <div id="log"></div>
        <button onclick="clearLog()">Clear Log</button>
    </div>

    <script>
        let pollingInterval = null;
        let typingTimeout = null;
        let userRole = '';
        let apiUrl = window.location.pathname.includes('/public/')
            ? '../backend/api_postgres.php'
            : '/backend/api_postgres.php';

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.innerHTML = `<span style="color: #666;">[${time}]</span> ${message}`;
            entry.style.margin = '5px 0';
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function showStatus(elementId, message, type) {
            const el = document.getElementById(elementId);
            el.textContent = message;
            el.className = 'status ' + type;
        }

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            log(`Attempting login as ${username}...`);

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: username === 'renz' ? 'doctor-login' : 'login',
                        username: username,
                        password: password
                    }),
                    credentials: 'same-origin'
                });

                const data = await response.json();
                if (data.success) {
                    userRole = username === 'renz' ? 'doctor' : 'admin';
                    showStatus('login-status', `Login successful! Role: ${userRole}`, 'success');
                    log(`Login successful. Role: ${userRole}`, 'success');
                } else {
                    showStatus('login-status', `Login failed: ${data.message}`, 'error');
                    log(`Login failed: ${data.message}`, 'error');
                }
            } catch (error) {
                showStatus('login-status', `Error: ${error.message}`, 'error');
                log(`Error: ${error.message}`, 'error');
            }
        }

        async function setTyping(isTyping) {
            if (!userRole) {
                showStatus('set-status', 'Please login first', 'error');
                log('Please login first', 'error');
                return;
            }

            log(`Setting typing status to ${isTyping} for ${userRole}...`);

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'set-typing-status',
                        userRole: userRole,
                        isTyping: isTyping
                    }),
                    credentials: 'same-origin'
                });

                const data = await response.json();
                if (data.success) {
                    showStatus('set-status', `Typing set to ${isTyping}`, 'success');
                    log(`Typing status set to ${isTyping}`, 'success');
                } else {
                    showStatus('set-status', `Failed: ${data.message}`, 'error');
                    log(`Failed: ${data.message}`, 'error');
                }
            } catch (error) {
                showStatus('set-status', `Error: ${error.message}`, 'error');
                log(`Error: ${error.message}`, 'error');
            }
        }

        async function checkTyping() {
            if (!userRole) {
                showStatus('check-status', 'Please login first', 'error');
                log('Please login first', 'error');
                return;
            }

            log(`Checking if partner is typing for ${userRole}...`);

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'get-typing-status',
                        userRole: userRole
                    }),
                    credentials: 'same-origin'
                });

                const data = await response.json();
                if (data.success) {
                    const partnerIsTyping = data.partnerIsTyping;
                    showStatus('check-status', `Partner is typing: ${partnerIsTyping}`, partnerIsTyping ? 'info' : 'success');
                    log(`Partner is typing: ${partnerIsTyping}`, partnerIsTyping ? 'info' : 'success');
                } else {
                    showStatus('check-status', `Failed: ${data.message}`, 'error');
                    log(`Failed: ${data.message}`, 'error');
                }
            } catch (error) {
                showStatus('check-status', `Error: ${error.message}`, 'error');
                log(`Error: ${error.message}`, 'error');
            }
        }

        function handleTypingInput() {
            if (!userRole) {
                log('Please login first', 'error');
                return;
            }

            log('Typing detected - setting status to TRUE');
            setTyping(true);

            // Clear typing status after 3 seconds of no input
            if (typingTimeout) {
                clearTimeout(typingTimeout);
            }
            typingTimeout = setTimeout(() => {
                log('3 seconds of no typing - setting status to FALSE');
                setTyping(false);
            }, 3000);
        }

        function startPolling() {
            if (!userRole) {
                showStatus('poll-status', 'Please login first', 'error');
                log('Please login first', 'error');
                return;
            }

            if (pollingInterval) {
                showStatus('poll-status', 'Already polling', 'error');
                return;
            }

            log('Starting polling every 1 second...');
            pollingInterval = setInterval(async () => {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            action: 'get-typing-status',
                            userRole: userRole
                        }),
                        credentials: 'same-origin'
                    });

                    const data = await response.json();
                    if (data.success) {
                        const partnerIsTyping = data.partnerIsTyping;
                        log(`Poll: Partner is typing = ${partnerIsTyping}`, partnerIsTyping ? 'info' : 'success');
                    }
                } catch (error) {
                    log(`Poll error: ${error.message}`, 'error');
                }
            }, 1000);

            showStatus('poll-status', 'Polling started', 'success');
        }

        function stopPolling() {
            if (pollingInterval) {
                clearInterval(pollingInterval);
                pollingInterval = null;
                log('Polling stopped');
                showStatus('poll-status', 'Polling stopped', 'success');
            }
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        // Setup typing input listener
        document.getElementById('typing-input').addEventListener('input', handleTypingInput);
        document.getElementById('typing-input').addEventListener('blur', () => {
            log('Input lost focus - setting status to FALSE');
            setTyping(false);
        });

        log('Test page loaded. Ready to test.');
    </script>
</body>
</html>
